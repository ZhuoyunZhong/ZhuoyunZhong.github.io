# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio@sha256:31a8af846095e7bbb43981019af0400c3a3da79c9d6c44a5e5b871cfe6a115e7
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        bundle check || bundle install &&
        exec bundle exec jekyll serve \
          --watch \
          --port=9090 \
          --host=0.0.0.0 \
          --livereload \
          --livereload-port=35730 \
          --force_polling
    ports:
      - 9090:9090
      - 35730:35730
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
